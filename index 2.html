<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WHS Music Games – Timer & Quiz Test</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#18283a;background:#eef2f7}*{box-sizing:border-box}body{margin:0}.wrap{max-width:960px;margin:auto;padding:18px}.panel{background:white;border-radius:18px;padding:clamp(18px,4vw,34px);box-shadow:0 4px 24px #1d33441c;min-height:72vh;display:flex;flex-direction:column;gap:18px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{font-size:clamp(16px,2.5vw,23px);font-weight:800}.tag{background:#e9eff7;border-radius:30px;padding:8px 12px;font-weight:700}.center{text-align:center}.hero{font-size:clamp(38px,7vw,75px);line-height:1.12;font-weight:850;max-width:850px;margin:25px auto}.small{color:#46576a;font-size:clamp(15px,2vw,19px)}.count{font-size:clamp(55px,10vw,110px);font-weight:850;font-variant-numeric:tabular-nums}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{font:inherit;font-size:18px;font-weight:750;padding:14px 22px;min-height:52px;border-radius:12px;border:2px solid #b5c2d1;background:white;color:#18283a;cursor:pointer}button.primary{background:#135d9d;border-color:#135d9d;color:white}button:disabled{opacity:.45;cursor:default}button.selected{border-color:#135d9d;background:#e4f1ff}.answer{width:100%;text-align:left}.answer.correct{border-color:#16844b;background:#e7f7ed}.answer.wrong{border-color:#b93737;background:#fff0f0}.feedback{background:#edf5fc;padding:18px;border-radius:12px;font-size:19px}.progress{height:10px;border-radius:20px;background:#dbe4ed;overflow:hidden}.bar{height:100%;background:#1767a7;transition:width .2s}.bottom{margin-top:auto}.warning{color:#a52828}.label{font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#55677c;font-size:14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:580px){.choices{grid-template-columns:1fr}.panel{min-height:82vh}.wrap{padding:8px}}@media(orientation:landscape) and (max-height:600px){.panel{min-height:94vh;gap:9px;padding:14px}.hero{font-size:clamp(32px,7vh,54px);margin:6px auto}.count{font-size:clamp(42px,12vh,75px)}button{padding:8px 14px;min-height:42px;font-size:16px}}
</style></head><body><div class="wrap"><main class="panel" id="app" aria-live="polite"></main></div><script>
'use strict';
// Standalone test: four rounds of five clues, a quiz after round two, and a revision check after round four.
const rounds=[
['Playing air guitar','Conducting an orchestra','Singing into a microphone','Playing a drum solo','Tuning a guitar'],
['Playing a trumpet','Dancing the waltz','Playing a piano with one finger','Singing in a choir','Marching to a beat'],
['Playing the violin','A drummer losing a drumstick','Playing a bass guitar','A singer holding a long note','Playing a cymbal crash'],
['A DJ mixing music','Playing a flute','A guitarist bending a string','A musician taking a bow','Playing a very quiet drumbeat']
];
const bank=[
{id:'tempo',q:'What does tempo describe?',a:['How fast or slow the music is','How loud the music is','The instruments being played'],correct:0,why:'Tempo is the speed of the beat.'},
{id:'timbre',q:'What does timbre mean?',a:['How many beats are in a bar','The distinctive sound quality of an instrument or voice','How high a note is'],correct:1,why:'Timbre is the characteristic sound quality that helps us distinguish sounds.'},
{id:'crescendo',q:'What is a crescendo?',a:['Gradually getting softer','Gradually getting faster','Gradually getting louder'],correct:2,why:'A crescendo is a gradual increase in volume.'},
{id:'fill',q:'What is a drum fill?',a:['A short rhythmic variation','The name of a drum','A type of microphone'],correct:0,why:'A drum fill is a short rhythmic variation, often used between sections.'},
{id:'pitch',q:'What is pitch?',a:['The speed of music','How high or low a sound is','The volume of music'],correct:1,why:'Pitch describes how high or low a sound is.'},
{id:'call',q:'What is call and response?',a:['Two musical ideas answering one another','Playing music very quietly','A change in instrument'],correct:0,why:'Call and response is when one musical phrase is answered by another.'},
{id:'pulse',q:'What is the pulse in music?',a:['The steady underlying beat','The words of a song','The loudest instrument'],correct:0,why:'Pulse is the regular underlying beat you can tap along to.'},
{id:'dynamics',q:'What do dynamics describe?',a:['The musical style','The volume of music','The order of sections'],correct:1,why:'Dynamics refer to loudness and softness in music.'},
{id:'ostinato',q:'What is an ostinato?',a:['A repeated musical pattern','A very fast tempo','A brass instrument'],correct:0,why:'An ostinato is a musical pattern that repeats.'}
];
let duration=30,screen='home',round=0,clue=0,remaining=30,running=false,deadline=0,tick=null,quizList=[],quizIndex=0,choice=null,wrong=[],asked=new Set(),replayCount=0;
const app=document.getElementById('app');
function stop(){if(tick){clearInterval(tick);tick=null}running=false}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function head(label){return `<header><div class="brand">🎵 WHS MUSIC GAMES</div><div class="tag">${label}</div></header>`}
function buttons(s){return `<div class="controls">${s}</div>`}
function btn(label,action,kind=''){return `<button ${kind?'class="'+kind+'"':''} onclick="${action}">${label}</button>`}
function render(){
if(screen==='home'){app.innerHTML=head('iPad test')+`<div class="center"><div class="label">Charades • Timer & quiz prototype</div><h1 class="hero">GAME ON!</h1><p class="small">4 short rounds · 5 clues per round · 3 music questions after every 2 rounds</p><h2>Time per clue</h2><div class="controls"><button class="${duration===30?'selected':''}" onclick="chooseDuration(30)">30 seconds (default)</button><button class="${duration===60?'selected':''}" onclick="chooseDuration(60)">1 minute</button></div><p class="small">Timer begins only when you press Start. It automatically moves to the next clue.</p></div><div class="bottom">${buttons(btn('Start test','startGame()','primary'))}</div>`;return}
if(screen==='ready'){app.innerHTML=head(`Round ${round+1} of ${rounds.length}`)+`<div class="center"><div class="label">Traditional charades</div><h1 class="hero">Round ${round+1}</h1><p class="small">One actor sees the clue. No talking or sound effects. Guessers must not see the screen.</p><p class="small">Each clue lasts ${duration} seconds. Press Start when everyone is ready.</p></div><div class="bottom">${buttons(btn('Start round','startRound()','primary')+btn('Back to menu','goHome()'))}</div>`;return}
if(screen==='clue'){const pct=100*remaining/duration;app.innerHTML=head(`Round ${round+1} · Clue ${clue+1}/5`)+`<div class="center"><div class="label">ACT THIS OUT</div><h1 class="hero">${escapeHtml(rounds[round][clue])}</h1><div class="count ${remaining<=5?'warning':''}" id="clock">${fmt(remaining)}</div><div class="progress"><div id="bar" class="bar" style="width:${pct}%"></div></div><p class="small">${running?'Automatically advances when time runs out':'Paused'}</p></div><div class="bottom">${buttons(btn(running?'Pause':'Resume','togglePause()','primary')+btn('Next clue →','advanceClue()')+btn('Restart clue','restartClue()'))}</div>`;return}
if(screen==='stop'){app.innerHTML=head(`Round ${round+1} finished`)+`<div class="center"><div class="label">Stop screen</div><h1 class="hero">STOP!</h1><p class="small">Round ${round+1} complete.</p></div><div class="bottom">${buttons(btn(round%2===1?'Unlock questions →': 'Next round →','afterRound()','primary')+btn('Back to menu','goHome()'))}</div>`;return}
if(screen==='quiz'){const q=quizList[quizIndex];const options=q.order.map((n,i)=>{let state=choice===null?'':i===q.order.indexOf(q.correct)?'correct':i===choice?'wrong':'';return `<button class="answer ${state}" ${choice!==null?'disabled':''} onclick="answerQuestion(${i})">${String.fromCharCode(65+i)}. ${escapeHtml(q.a[n])}</button>`}).join('');const feedback=choice===null?'':`<div class="feedback"><strong>${q.order[choice]===q.correct?'Correct!':'Not quite. Correct answer: '+escapeHtml(q.a[q.correct])}</strong><p>${escapeHtml(q.why)}</p></div>`;app.innerHTML=head(`Music quiz · ${quizIndex+1} of ${quizList.length}`)+`<div class="label">Unlock the next rounds</div><h2>${escapeHtml(q.q)}</h2><div class="choices">${options}</div>${feedback}<div class="bottom">${choice===null?'<p class="small">Choose one answer. There is no timer.</p>':buttons(btn(quizIndex===quizList.length-1?'Finish questions':'Next question →','nextQuestion()','primary'))}</div>`;return}
if(screen==='unlocked'){app.innerHTML=head('Unlocked!')+`<div class="center"><h1 class="hero">🔓 ${round===rounds.length-1?'Test complete!':'Rounds unlocked!'}</h1><p class="small">${wrong.length?`${wrong.length} question${wrong.length===1?' is':'s are'} in your revision queue.`:'All questions answered correctly so far.'}</p><p class="small">${round===rounds.length-1?'You have tested the timer, quiz and revision system.':'Keep playing! Incorrect answers may return in the next quiz.'}</p></div><div class="bottom">${buttons(round===rounds.length-1?btn('Test again','goHome()','primary'):btn('Next round →','nextRound()','primary')+btn('Back to menu','goHome()'))}</div>`;return}
}
function fmt(n){return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`}
function chooseDuration(n){duration=n;render()}
function goHome(){stop();screen='home';round=0;clue=0;wrong=[];asked=new Set();replayCount=0;render()}
function startGame(){stop();round=0;clue=0;wrong=[];asked=new Set();replayCount=0;screen='ready';render()}
function startRound(){clue=0;beginClue()}
function beginClue(){stop();remaining=duration;screen='clue';render();resume()}
function resume(){running=true;deadline=Date.now()+remaining*1000;tick=setInterval(()=>{const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(n!==remaining){remaining=n;const el=document.getElementById('clock');const bar=document.getElementById('bar');if(el)el.textContent=fmt(n);if(bar)bar.style.width=(100*n/duration)+'%'}if(n<=0)advanceClue()},150);render()}
function togglePause(){if(running){const n=Math.max(0,Math.ceil((deadline-Date.now())/1000));stop();remaining=n;render()}else resume()}
function restartClue(){beginClue()}
function advanceClue(){stop();if(clue<4){clue++;beginClue()}else{screen='stop';render()}}
function afterRound(){if(round%2===1){makeQuiz();screen='quiz'}else{round++;screen='ready'}render()}
function shuffledOrder(){const a=[0,1,2];for(let i=2;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeQuiz(){const selected=[];if(wrong.length){const id=wrong.shift();const q=bank.find(x=>x.id===id);if(q){selected.push(q);replayCount++}}for(const q of bank){if(selected.length===3)break;if(!asked.has(q.id)&&!selected.some(x=>x.id===q.id))selected.push(q)}for(const q of bank){if(selected.length===3)break;if(!selected.some(x=>x.id===q.id))selected.push(q)}quizList=selected.map(q=>({...q,order:shuffledOrder()}));quizIndex=0;choice=null}
function answerQuestion(i){if(choice!==null)return;choice=i;const q=quizList[quizIndex];asked.add(q.id);if(q.order[i]!==q.correct&&!wrong.includes(q.id))wrong.push(q.id);render()}
function nextQuestion(){if(choice===null)return;if(quizIndex<quizList.length-1){quizIndex++;choice=null;screen='quiz'}else screen='unlocked';render()}
function nextRound(){round++;screen='ready';render()}
render();
</script></body></html>
